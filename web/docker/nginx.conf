# Picks a locale off the visitor's Accept-Language header for the root-path
# redirect below — nothing else may use this. It is intentionally the simple
# "does the most-preferred tag start with pl" check, not full RFC 4647
# negotiation, because there are only two locales to choose between.
#
# This is a fourth place that knows a locale code, which CLAUDE.md's registry
# rule ("api/config/locales.php, web/src/lib/locales.ts, app/src/locales.ts —
# nothing else may") does not cover, because nginx can't read those files.
# Adding a third locale means adding a line here too.
map $http_accept_language $preferred_locale {
    default  en;
    ~*^pl    pl;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers (path only) so trailing-slash redirects
    # preserve whatever host:port the browser is on (e.g. localhost:4322 in dev).
    # Without this, Nginx builds "http://$host/concerts/" using only $host
    # (no port), sending the browser to port 80 instead of the mapped port.
    absolute_redirect off;

    # ── Root → visitor's locale ─────────────────────────────────────────────
    # web/src/pages/index.astro does Astro.redirect('/en', 301), but Astro's
    # static output can't send a real HTTP redirect — it compiles that into an
    # HTML page with a <meta http-equiv="refresh">, which paints a blank page
    # before the browser hops to /en/. Visible to users, and a soft-redirect
    # signal crawlers have to execute JS or wait out a timer to follow, instead
    # of a redirect they can act on immediately. Answering here — before
    # try_files ever looks for a file — means nothing renders in between.
    #
    # 302, not 301: this decision varies per visitor (their Accept-Language),
    # so it must never be treated as a fixed, cacheable fact about the URL.
    # A 301 is exactly that promise — browsers and shared caches are entitled
    # to remember it forever, which would pin the first visitor's language
    # onto / for everyone behind the same cache, permanently. Vary +
    # Cache-Control back that up: no intermediate cache may reuse this
    # response for a request with a different Accept-Language, or at all.
    location = / {
        add_header Vary "Accept-Language";
        add_header Cache-Control "no-store";
        return 302 /$preferred_locale/;
    }

    # ── Static assets — long-lived cache ─────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Token-based routes — serve shell page, island reads token from URL ───
    # Two rules apply to every block here, both learned the hard way:
    #   $uri/index.html, never $uri/ — the latter makes nginx 301 to add a
    #   trailing slash, and browsers cache that redirect permanently.
    #   =404 last — without it the shell page is the *fallback*, i.e. an
    #   internal redirect back into this block, looping until nginx 500s when
    #   the module is disabled and the page was never built. With =404 the
    #   shell page is an ordinary file check and =404 terminates.
    # See CLAUDE.md "Known footguns".
    location ^~ /newsletter/confirm/ {
        try_files $uri $uri/index.html /newsletter/confirm/index.html =404;
    }
    location ^~ /newsletter/unsubscribe/ {
        try_files $uri $uri/index.html /newsletter/unsubscribe/index.html =404;
    }
    location ^~ /rider/ {
        try_files $uri $uri/index.html /rider/index.html =404;
    }

    # ── API proxy → backend container ────────────────────────────────────────
    location /api/ {
        proxy_pass             http://backend/api/;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     120s;
        proxy_send_timeout     120s;
        client_max_body_size   10M;
    }

    # ── Storage (uploaded media) → backend container ─────────────────────────
    location ^~ /storage/ {
        proxy_pass         http://backend/storage/;
        proxy_set_header   Host              $host;
        proxy_cache_valid  200 1d;
        add_header         Cache-Control "public, max-age=86400";
    }

    # ── Everything else: static files ─────────────────────────────────────────
    # IMPORTANT: use $uri/index.html NOT $uri/ — the latter triggers a 301
    # trailing-slash redirect that browsers cache as permanent. Direct lookup
    # serves concerts/index.html for both /concerts and /concerts/ without
    # any redirect. See CLAUDE.md "Known footguns" for full explanation.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
