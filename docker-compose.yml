services:

  # ─── MySQL 8.4 ────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: bandms_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE:-bandms}
      MYSQL_USER:          ${DB_USERNAME:-bandms}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bandms
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Laravel API (PHP-FPM + Nginx in one container) ───────────────────────
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: app
    container_name: bandms_backend
    restart: unless-stopped
    environment:
      APP_NAME:    "BandMS"
      APP_ENV:     production
      APP_DEBUG:   "false"
      APP_KEY:     ${APP_KEY}
      APP_URL:     ${APP_URL:-http://localhost}

      DB_CONNECTION: mysql
      DB_HOST:       mysql
      DB_PORT:       3306
      DB_DATABASE:   ${DB_DATABASE:-bandms}
      DB_USERNAME:   ${DB_USERNAME:-bandms}
      DB_PASSWORD:   ${DB_PASSWORD:-secret}

      LOG_CHANNEL:      stderr
      LOG_LEVEL:        warning
      CACHE_DRIVER:     file
      SESSION_DRIVER:   file
      QUEUE_CONNECTION: sync

      # This service takes no env_file, so anything the app reads from the
      # environment has to be listed here — setting it in the root .env alone
      # does nothing. FRONTEND_URL drives CORS (config/cors.php) and the links
      # in outgoing email (config/newsletter.php); it must match the port users
      # actually browse on, which is the public site's 4322 in development.
      FRONTEND_URL:     ${FRONTEND_URL:-http://localhost}

      # Login attempts per minute, per IP. Keep low in production; raise it
      # locally for the E2E suite, which logs in repeatedly from one IP.
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}

      # The seeder creates an admin only when these are set, so production is
      # safe by default. The local stack declares them here to keep the fixed
      # login the E2E suite expects (app/e2e/fixtures/auth.ts). Note that
      # APP_ENV above is "production" even locally, so an environment check
      # could not tell these two stacks apart — hence the explicit variables.
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-admin@bandms.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}

      # Placeholder venue + concert. Handy locally, noise in production.
      SEED_DEMO_DATA: "true"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bandms

  # ─── Astro public site (SSG built at container start, served by Nginx) ───
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bandms_web
    restart: unless-stopped
    environment:
      API_BASE:  "http://backend"
      SITE_URL:  "${SITE_URL:-https://skanking-storks.com}"
    ports:
      - "${WEB_PORT:-4322}:80"
    depends_on:
      - backend
    networks:
      - bandms

  # ─── Vue 3 SPA (Nginx, proxies /api/* → backend) ─────────────────────────
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: bandms_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - bandms

volumes:
  mysql_data:
  backend_storage:

networks:
  bandms:
    driver: bridge
