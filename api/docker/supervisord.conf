[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

# Queued jobs run in this container. QUEUE_CONNECTION is "database" in
# production, so without a worker every dispatched job is written to the jobs
# table and never executed — silently, with no error anywhere.
#
# --max-time recycles the worker hourly so a long-lived process cannot hold a
# stale copy of the config cache or leak memory across a deploy.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --tries=3 --backoff=10 --max-time=3600 --sleep=3
user=www-data
autostart=true
autorestart=true
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
