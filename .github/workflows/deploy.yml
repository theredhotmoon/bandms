name: Deploy

on:
  push:
    branches: [main]
    # Documentation-only changes must not deploy. A deploy force-recreates the
    # `web` container, which costs ~20-60s of 502s on the public site while
    # Astro rebuilds — an outage with nothing to show for it when only prose
    # changed. Note paths-ignore skips the whole workflow, tests included; that
    # is correct here because none of these paths can affect a test outcome.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

# Two pushes in quick succession would otherwise race each other onto the
# server, and the loser could land its images after the winner's migrations.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/theredhotmoon/bandms/backend
  FRONTEND_IMAGE: ghcr.io/theredhotmoon/bandms/frontend
  WEB_IMAGE: ghcr.io/theredhotmoon/bandms/web

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t bandms-test ./api

      - name: Run backend tests
        run: |
          docker run --rm \
            -e APP_ENV=testing \
            bandms-test

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run frontend unit tests
        working-directory: ./app
        run: |
          npm install
          npm run test:unit

  build-and-push:
    name: Build & push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: app
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app
          target: app
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # The Astro site runs `astro build` at container startup, not here — the
      # build needs a live API to fetch from. This image is source + node_modules.
      - name: Build and push web (Astro public site)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          target: app
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to Hetzner
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose and Caddy config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,docker/caddy/Caddyfile"
          target: /opt/bandms/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR
          command_timeout: 15m
          script: |
            set -e
            cd /opt/bandms

            # Authenticate and pull new images
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose -f docker-compose.prod.yml pull backend frontend web

            # MySQL is not part of the rolling restart, but it must be running
            # before the backend starts — every command below uses --no-deps, so
            # nothing else would bring it up on a first deploy.
            docker compose -f docker-compose.prod.yml up -d mysql

            # Backend first: its entrypoint runs the migrations. --wait blocks
            # until the healthcheck passes, so the frontends never come up
            # against a half-migrated schema.
            docker compose -f docker-compose.prod.yml up -d --no-deps --wait backend

            # The Astro site rebuilds its static output at startup against the
            # freshly migrated API — this is what publishes new content.
            #
            # --force-recreate is deliberate. It costs 1-2 min of rebuild on
            # every deploy, including backend-only ones that could not have
            # changed the site. The alternative keeps the previous static HTML
            # serving until someone republishes by hand, and a silently stale
            # public site is the harder failure to notice. Chosen in #40 —
            # don't drop it to shave the deploy time without revisiting that.
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate web
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps caddy

            docker image prune -f
