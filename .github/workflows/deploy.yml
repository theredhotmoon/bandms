name: Deploy

on:
  push:
    branches: [main]
    # Documentation-only changes must not deploy. A deploy force-recreates the
    # `web` container, which costs ~20-60s of 502s on the public site while
    # Astro rebuilds — an outage with nothing to show for it when only prose
    # changed. Note paths-ignore skips the whole workflow, tests included; that
    # is correct here because none of these paths can affect a test outcome.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  # PRs only ever run the `test` job — build-and-push and deploy are gated to
  # push events below, so a PR from a fork (no access to GHCR/SSH secrets)
  # still gets a pass/fail check instead of silently reporting nothing.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

# Two pushes to main in quick succession would otherwise race each other onto
# the server, and the loser could land its images after the winner's
# migrations — so pushes share one non-cancelling group. PR runs use their own
# per-branch group instead: unrelated PRs must not queue behind each other or
# behind production, and a superseded push to the same PR should cancel the
# stale run rather than pile up.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BACKEND_IMAGE: ghcr.io/theredhotmoon/bandms/backend
  FRONTEND_IMAGE: ghcr.io/theredhotmoon/bandms/frontend
  WEB_IMAGE: ghcr.io/theredhotmoon/bandms/web

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t bandms-test ./api

      - name: Run backend tests
        run: |
          docker run --rm \
            -e APP_ENV=testing \
            bandms-test

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # app/ depends on @bandms/rider-core via a `workspace:*` protocol, which
      # only pnpm understands — npm fails with EUNSUPPORTEDPROTOCOL. And per
      # the root CLAUDE.md, install must run from the repo root: `pnpm install`
      # inside app/ alone won't link the workspace package.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        working-directory: ./app
        run: pnpm test:unit

  build-and-push:
    name: Build & push images
    needs: test
    # GHCR pushes and the deploy below have no business running against a PR
    # — no secrets a fork PR could use anyway, and nothing should reach the
    # server before landing on main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: app
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: app
          # Both are baked into the bundle at build time, so they can only be
          # set here — not on the server. ADMIN_PATH must match what the caddy
          # service resolves at runtime, or Caddy routes the prefix to a
          # frontend that expects a different one and the panel renders nothing.
          # Unset is safe: the SPA falls back to 'admin' and so does Caddy.
          build-args: |
            VITE_ADMIN_PATH=${{ vars.ADMIN_PATH }}
            VITE_CARTO_KEY=${{ secrets.PUBLIC_CARTO_KEY }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # The Astro site runs `astro build` at container startup, not here — the
      # build needs a live API to fetch from. This image is source + node_modules.
      - name: Build and push web (Astro public site)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          target: app
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to Hetzner
    needs: build-and-push
    # Redundant with build-and-push's own `if` (a skipped dependency skips
    # this job anyway) — kept explicit so the constraint is visible here too.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose and Caddy config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,docker/caddy/Caddyfile,scripts/prod-backup-db.sh"
          target: /opt/bandms/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          APP_URL: ${{ secrets.APP_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          APP_FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,PUBLIC_GA_MEASUREMENT_ID,SITE_ADDRESS,APP_URL,FRONTEND_URL,APP_FRONTEND_URL,SITE_URL
          command_timeout: 15m
          script: |
            set -e
            cd /opt/bandms

            # Authenticate and pull new images
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose -f docker-compose.prod.yml pull backend frontend web

            # Some .env vars have no home other than a GitHub secret: nobody
            # without server SSH access could ever set them by hand (see
            # docs/deployment.md). For those, the secret is authoritative and
            # overwrites .env on every deploy — guarded on non-empty so an
            # unset/cleared secret leaves an existing value alone rather than
            # silently blanking it (this guard was itself a code-review catch
            # on the PUBLIC_GA_MEASUREMENT_ID version of this).
            #
            # Deliberately not a sed substitution: &, |, and \ are all special
            # in sed's replacement text, and a first attempt at escaping them
            # here was itself wrong (verified: `sed 's/&/\\&/g'` does not
            # produce a literal backslash under this pipeline's sed — testing
            # that fix locally on Windows Git Bash gave a false pass, since
            # the real target is the server's sed over SSH; a second, live
            # test caught it). Filtering the old line out and appending the
            # new one has no replacement-text semantics to get wrong, at the
            # cost of moving an updated key to the end of the file — harmless
            # for a shell-sourced .env.
            #
            # Two things the `sed -i` this replaced did for free, and which have
            # to be done by hand here: `mv` gives .env the temp file's own
            # umask-derived mode (0644), silently widening a file that holds
            # APP_KEY, DB_PASSWORD, STRIPE_SECRET_KEY and MAIL_PASSWORD (step 8
            # of docs/deployment.md chmods it 0600) — so the temp file is
            # created private and the mode re-asserted after the swap; and
            # `grep -v` exits 1 when it emits no lines, which under `set -e`
            # would abort the deploy over an .env holding nothing but this one
            # key.
            sync_secret_env() {
              local key="$1" value="$2"
              [ -n "$value" ] || return 0
              if [ -f .env ]; then
                touch .env.tmp
                chmod 600 .env.tmp
                grep -v "^${key}=" .env > .env.tmp || true
                mv .env.tmp .env
              fi
              echo "${key}=${value}" >> .env
              chmod 600 .env
            }
            # web reads this at container startup, before it's recreated below.
            sync_secret_env PUBLIC_GA_MEASUREMENT_ID "$PUBLIC_GA_MEASUREMENT_ID"

            # SITE_ADDRESS (caddy) is what turns on automatic HTTPS (Caddy
            # provisions and renews the Let's Encrypt certificate itself;
            # nothing else is needed) — left unset, Caddy falls back to plain
            # :80, which is what silently broke GA4: gtag.js can't set its
            # Secure client-ID cookie or send hits on a page that isn't a
            # secure context. APP_URL/FRONTEND_URL/APP_FRONTEND_URL/SITE_URL
            # are the other half of "switch to a domain" (see
            # docs/deployment.md step 11) — moving SITE_ADDRESS to a real
            # hostname without also moving these leaves CORS, Stripe redirect
            # URLs and outgoing-email links still pointing at the old value.
            #
            # So these five are all-or-nothing, enforced here rather than
            # left as a warning in a comment (a code-review catch): a partial
            # set aborts the deploy instead of silently half-migrating the
            # origin.
            domain_vars_set=0
            for v in "$SITE_ADDRESS" "$APP_URL" "$FRONTEND_URL" "$APP_FRONTEND_URL" "$SITE_URL"; do
              [ -n "$v" ] && domain_vars_set=$((domain_vars_set + 1))
            done
            if [ "$domain_vars_set" -gt 0 ] && [ "$domain_vars_set" -lt 5 ]; then
              echo "::error::SITE_ADDRESS/APP_URL/FRONTEND_URL/APP_FRONTEND_URL/SITE_URL must all be set together, or none at all — only $domain_vars_set of 5 are set as secrets." >&2
              exit 1
            fi

            # caddy reads SITE_ADDRESS at container startup, before its own
            # --force-recreate further down; backend picks up
            # APP_URL/FRONTEND_URL/APP_FRONTEND_URL on its own `up -d` below
            # (compose recreates on a changed resolved env, no
            # --force-recreate needed); web picks up SITE_URL the same way.
            sync_secret_env SITE_ADDRESS "$SITE_ADDRESS"
            sync_secret_env APP_URL "$APP_URL"
            sync_secret_env FRONTEND_URL "$FRONTEND_URL"
            sync_secret_env APP_FRONTEND_URL "$APP_FRONTEND_URL"
            sync_secret_env SITE_URL "$SITE_URL"

            # MySQL is not part of the rolling restart, but it must be running
            # before the backend starts — every command below uses --no-deps, so
            # nothing else would bring it up on a first deploy.
            docker compose -f docker-compose.prod.yml up -d mysql

            # Dump the database BEFORE the backend starts, because starting it
            # runs the migrations. Everything else about a deploy is reversible
            # by retagging an image; a migration that drops a column is not.
            # A non-zero exit here aborts the deploy (set -e) — which is the
            # point: no verified backup, no schema change.
            chmod +x scripts/prod-backup-db.sh
            ./scripts/prod-backup-db.sh

            # Backend next: its entrypoint runs the migrations. --wait blocks
            # until the healthcheck passes, so the frontends never come up
            # against a half-migrated schema.
            docker compose -f docker-compose.prod.yml up -d --no-deps --wait backend

            # The Astro site rebuilds its static output at startup against the
            # freshly migrated API — this is what publishes new content.
            #
            # --force-recreate is deliberate. It costs 1-2 min of rebuild on
            # every deploy, including backend-only ones that could not have
            # changed the site. The alternative keeps the previous static HTML
            # serving until someone republishes by hand, and a silently stale
            # public site is the harder failure to notice. Chosen in #40 —
            # don't drop it to shave the deploy time without revisiting that.
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate web
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend

            # --force-recreate is required, not cosmetic. The Caddyfile is a
            # bind mount, so its CONTENTS are not part of the service config
            # hash compose diffs against — a plain `up -d` reports the container
            # up-to-date and skips it, and Caddy (which parses its config once
            # at startup) keeps serving the previous routing table forever. The
            # scp above also replaces the file's inode, which a single-file bind
            # mount does not follow. Recreating is the only thing that reliably
            # applies a routing change. Dropping this silently reverts every
            # future Caddyfile edit.
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate caddy

            docker image prune -f
