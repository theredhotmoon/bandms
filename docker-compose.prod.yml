services:
  caddy:
    image: caddy:2-alpine
    container_name: bandms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # The Caddy site address. ":80" serves plain HTTP on the bare server IP.
      # Set SITE_ADDRESS to a hostname (e.g. "skanking-storks.com") in
      # /opt/bandms/.env and Caddy provisions a Let's Encrypt certificate
      # automatically — no other change needed.
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - bandms
    depends_on:
      - web
      - frontend

  # ─── Astro public site — the thing visitors actually see ──────────────────
  # Builds the static site at container startup (it needs a live API to fetch
  # from), so a restart is how you republish content. See CLAUDE.md.
  web:
    image: ghcr.io/theredhotmoon/bandms/web:${APP_VERSION:-latest}
    container_name: bandms-web
    restart: unless-stopped
    environment:
      API_BASE: "http://backend"
      SITE_URL: "${SITE_URL:-${APP_URL}}"
      # Which theme the public site renders under. Empty falls back to the
      # plain black-and-white base — see web/src/styles/themes/.
      PUBLIC_THEME: "${PUBLIC_THEME:-skanking-storks}"
      # CARTO basemap key for the concert maps. Unset renders tiles watermarked
      # "API KEY REQUIRED" — see web/src/lib/basemap.ts.
      PUBLIC_CARTO_KEY: "${PUBLIC_CARTO_KEY:-}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bandms

  # ─── Vue SPA — admin panel, login, fan accounts, ticket claim ─────────────
  frontend:
    image: ghcr.io/theredhotmoon/bandms/frontend:${APP_VERSION:-latest}
    container_name: bandms-frontend
    restart: unless-stopped
    networks:
      - bandms

  backend:
    image: ghcr.io/theredhotmoon/bandms/backend:${APP_VERSION:-latest}
    container_name: bandms-backend
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-BandMS}"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"

      # Logs to stdout so `docker logs bandms-backend` works. Without this the
      # default stack driver writes into the container filesystem, which is
      # discarded on every deploy.
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-warning}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      SETLISTFM_API_KEY: "${SETLISTFM_API_KEY:-}"

      # Must be listed here to reach the app — this service takes no env_file.
      # Drives CORS allowed_origins (config/cors.php), which otherwise falls
      # back to http://localhost:5173, and the links in outgoing email
      # (config/newsletter.php). Set it to the real public domain.
      FRONTEND_URL: "${FRONTEND_URL:-${APP_URL}}"

      # A SEPARATE variable read only by config/services.php, which builds the
      # Stripe success_url / cancel_url. Its fallback is http://localhost:5173,
      # so leaving it unset sends every paying customer to a dead host.
      APP_FRONTEND_URL: "${APP_FRONTEND_URL:-${FRONTEND_URL:-${APP_URL}}}"

      # ── Mail ──────────────────────────────────────────────────────────────
      # MAIL_MAILER defaults to "log", which silently drops newsletter
      # confirmations, contact-form mail and rig confirmation requests.
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-${APP_NAME:-BandMS}}"
      CONTACT_EMAIL: "${CONTACT_EMAIL:-}"
      NEWSLETTER_VERIFY_MX: "${NEWSLETTER_VERIFY_MX:-true}"

      # ── Stripe ────────────────────────────────────────────────────────────
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"

      # Login attempts per minute, per IP. This is the control that makes
      # credential stuffing expensive — keep it low here.
      LOGIN_RATE_LIMIT: "${LOGIN_RATE_LIMIT:-10}"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # The WHOLE storage dir, not just app/public. Passport's oauth-*.key
      # lives in storage/ — mounting only app/public means every deploy gets a
      # fresh container, regenerates the keys, and invalidates every token
      # already issued, logging out every user.
      - bandms-storage:/var/www/html/storage
    networks:
      - bandms
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:8.4
    container_name: bandms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - bandms-mysql:/var/lib/mysql
    networks:
      - bandms
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 5
      timeout: 5s
      interval: 10s
      start_period: 30s

networks:
  bandms:
    driver: bridge

volumes:
  bandms-mysql:
  bandms-storage:
  caddy-data:
  caddy-config:
